# O plano grátis do Render dorme depois de uns 15 minutos sem acesso. Quem mantém a API no ar de
# verdade é o agendamento do banco da produção (pg_cron no Supabase, a cada 10 minutos, das 6h às
# 23h de MS; ver o README). Este acesso fica de reserva: o GitHub atrasa os agendamentos e ele
# acaba rodando só umas 4 vezes por dia.
name: Manter a API acordada

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  acessar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Acessar a API
        run: |
          curl --silent --show-error --fail --max-time 90 --retry 2 --retry-delay 10 \
            https://agenda-academica-api-ql31.onrender.com/ > /dev/null
