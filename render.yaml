# Blueprint do Render: cria a API (AdonisJS) a partir deste repositório.
# No painel do Render: New > Blueprint > escolher o repositório.
# O front (Next.js) vai para o Vercel; ver a seção "Deploy" do README.
services:
  - type: web
    name: agenda-academica-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TZ
        value: UTC
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: cookie
      # Chave gerada pelo Render na criação; nunca reaproveitar a do docker-compose
      - key: APP_KEY
        generateValue: true
      # Endereço do front no Vercel; o "*" cobre o domínio final e as prévias
      - key: CORS_ORIGIN
        value: https://agenda-academica*.vercel.app
      # Entrar com o Google: os valores vêm da credencial do Google Cloud e são preenchidos
      # no painel do Render (Environment); nunca ficam no repositório
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Para onde a volta do Google leva a pessoa (o front no Vercel)
      - key: FRONTEND_URL
        value: https://agenda-academica-chi.vercel.app
      # Lembretes por e-mail: chave de API do Brevo e o remetente verificado lá,
      # preenchidos no painel do Render (Environment)
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Contas de demonstração e administração: DEMO_ACCOUNTS=false desliga as contas @agenda.test, e
      # ADMIN_EMAILS (e-mails separados por vírgula) vira administração ao entrar com o Google. As duas são
      # criadas no painel do Render quando for a hora; sem elas, as contas de demonstração ficam ligadas.
      # Banco Postgres do Supabase: os dados ficam salvos entre os reinícios da API.
      # O endereço (com usuário e senha) é colado no painel do Render (Environment), nunca aqui.
      - key: DB_CONNECTION
        value: pg
      - key: DATABASE_URL
        sync: false

  # Demonstração: a mesma API, com banco próprio (outro projeto do Supabase) e todas as contas de
  # demonstração ligadas, inclusive a coordenação. Fica separada da produção para as contas com senha
  # pública nunca alcançarem dados reais. Sem Google e sem e-mail: ninguém de verdade entra aqui.
  - type: web
    name: agenda-academica-demo-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TZ
        value: UTC
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: cookie
      - key: APP_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: https://agenda-academica*.vercel.app
      # Endereço do front da demonstração no Vercel, preenchido no painel
      - key: FRONTEND_URL
        sync: false
      - key: DEMO_ACCOUNTS
        value: "true"
      - key: DB_CONNECTION
        value: pg
      # Banco da demonstração (o endereço com a senha é colado no painel, nunca aqui)
      - key: DATABASE_URL
        sync: false
