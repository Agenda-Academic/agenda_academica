
<section class="g-sec" id="sec-acesso">
  <header class="g-sec-head">
    <span class="n">01</span>
    <h2>Acesso</h2>
    <p>Entrada única para os três perfis. O login aceita e-mail e senha ou um atalho para as contas de demonstração; o cadastro cria contas de aluno ou professor (a administração é provisionada pela instituição).</p>
  </header>
  <div class="g-frames">

    <!-- ============================ TELA 1 · ENTRAR ============================ -->
    <figure class="frame" id="tela-entrar">
      <figcaption><span class="g-tag">Tela 1</span><b>Entrar</b> Login com e-mail e senha ou por perfil de demonstração.<span class="g-rfs"><span class="g-rf">RF02</span></span></figcaption>
      <div class="screen desk" data-name="Tela 1 · Entrar">
        <div style="min-height:940px;display:flex;flex-wrap:wrap">
          <section style="flex:1 1 600px;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:44px;padding:52px 60px;background:var(--night);color:#fff">
            <div style="display:flex;align-items:center;gap:14px">
              <span class="mark" style="width:48px;height:48px;border-radius:14px"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px" aria-hidden="true"><path d="M22 10v6"/><path d="M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></span>
              <div>
                <p class="disp" style="font-size:20px;font-weight:700">Agenda Acadêmica</p>
                <p style="margin-top:2px;font-size:13px;color:var(--on-night-2)">IFMS · Campus Três Lagoas</p>
              </div>
            </div>

            <div style="max-width:580px">
              <p class="eyebrow" style="color:var(--accent)">Fonte única da verdade</p>
              <h1 class="disp" style="margin-top:14px;font-size:56px;line-height:1.02;font-weight:700;letter-spacing:-.035em">Todos os prazos do semestre, em um só lugar.</h1>
              <p style="margin-top:18px;max-width:500px;font-size:17px;line-height:1.6;color:var(--on-night)">Provas, trabalhos e o calendário oficial da reitoria reunidos para alunos, professores e coordenação.</p>

              <ul style="margin-top:36px;display:flex;flex-direction:column;gap:10px;max-width:480px">
                <li style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)">
                  <span style="width:44px;text-align:center;flex-shrink:0"><span style="display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--on-night-2)">SEX</span><span class="disp" style="display:block;font-size:24px;font-weight:700;line-height:1.1">26</span></span>
                  <span style="flex:1;min-width:0"><span style="display:block;font-size:14.5px;font-weight:600">Prova de Engenharia de Software</span><span style="display:block;margin-top:3px;font-size:12.5px;color:var(--on-night-2)">19:00 · Sala 7 · Bloco A</span></span>
                  <span class="pill c-prova">Prova</span>
                </li>
                <li style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)">
                  <span style="width:44px;text-align:center;flex-shrink:0"><span style="display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--on-night-2)">SEG</span><span class="disp" style="display:block;font-size:24px;font-weight:700;line-height:1.1">29</span></span>
                  <span style="flex:1;min-width:0"><span style="display:block;font-size:14.5px;font-weight:600">Semana acadêmica</span><span style="display:block;margin-top:3px;font-size:12.5px;color:var(--on-night-2)">29 jun – 3 jul · Auditório Central</span></span>
                  <span class="pill c-inst">Institucional</span>
                </li>
                <li style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)">
                  <span style="width:44px;text-align:center;flex-shrink:0"><span style="display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--on-night-2)">QUA</span><span class="disp" style="display:block;font-size:24px;font-weight:700;line-height:1.1">01</span></span>
                  <span style="flex:1;min-width:0"><span style="display:block;font-size:14.5px;font-weight:600">Entrega do projeto integrador</span><span style="display:block;margin-top:3px;font-size:12.5px;color:var(--on-night-2)">23:59 · Ambiente virtual (Moodle)</span></span>
                  <span class="pill c-trab">Trabalho</span>
                </li>
              </ul>
            </div>

            <ul style="display:flex;flex-wrap:wrap;gap:12px 28px;font-size:14px;color:var(--on-night)">
              <li style="display:flex;align-items:center;gap:10px"><svg class="i" viewBox="0 0 24 24" style="color:var(--accent)" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>Prazos docentes e datas oficiais no mesmo fluxo</li>
              <li style="display:flex;align-items:center;gap:10px"><svg class="i" viewBox="0 0 24 24" style="color:var(--accent)" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Lembretes com antecedência configurável</li>
              <li style="display:flex;align-items:center;gap:10px"><svg class="i" viewBox="0 0 24 24" style="color:var(--accent)" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Visões próprias para aluno, professor e administração</li>
            </ul>
          </section>

          <section style="flex:1 1 480px;min-width:0;display:flex;align-items:center;justify-content:center;padding:48px 32px;background:var(--bg)">
            <form style="width:100%;max-width:440px" aria-label="Entrar na agenda">
              <nav class="seg" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%" aria-label="Acesso">
                <a class="on" href="#tela-entrar" aria-current="page" style="justify-content:center"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Entrar</a>
                <a href="#tela-cadastro" style="justify-content:center"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>Criar conta</a>
              </nav>

              <h2 class="disp" style="margin-top:34px;font-size:38px;line-height:1.1;font-weight:700">Entrar na agenda</h2>
              <p style="margin-top:10px;font-size:15px;line-height:1.55;color:var(--ink-3)">Use seu e-mail institucional ou escolha um perfil de demonstração.</p>

              <div style="margin-top:28px;display:flex;flex-direction:column;gap:18px">
                <div>
                  <label class="lbl" for="l-email">E-mail</label>
                  <input class="input" id="l-email" data-login-email type="email" value="diogo@agenda.test" autocomplete="email">
                </div>
                <div>
                  <label class="lbl" for="l-senha">Senha</label>
                  <div style="position:relative">
                    <input class="input" id="l-senha" type="password" value="password123" style="padding-right:56px">
                    <button type="button" data-eye="l-senha" aria-label="Mostrar senha" style="position:absolute;right:4px;top:3px;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                  </div>
                </div>
              </div>

              <a class="btn btn-p" data-entrar href="#tela-painel-aluno" style="margin-top:26px;width:100%;min-height:52px;font-size:15.5px">Entrar<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>

              <div style="margin:32px 0 14px;display:flex;align-items:center;gap:12px">
                <span style="flex:1;height:1px;background:var(--line-strong)"></span>
                <span class="eyebrow">Contas de demonstração</span>
                <span style="flex:1;height:1px;background:var(--line-strong)"></span>
              </div>

              <div class="demos" role="group" aria-label="Contas de demonstração" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
                <a class="demo on" href="#tela-painel-aluno" data-email="diogo@agenda.test" aria-pressed="true">
                  <span style="display:flex;align-items:center;justify-content:space-between"><span class="demo-ico" style="background:var(--brand);color:#fff"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10v6"/><path d="M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></span><svg class="i demo-check" viewBox="0 0 24 24" role="img" aria-label="Selecionada"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg></span>
                  <span><span class="demo-t">Aluno</span><span class="demo-s">Consulta prazos e configura lembretes</span></span>
                </a>
                <a class="demo" href="#tela-painel-professor" data-email="apio@agenda.test" aria-pressed="false">
                  <span style="display:flex;align-items:center;justify-content:space-between"><span class="demo-ico" style="background:#EDE9FE;color:#5B21B6"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span><svg class="i demo-check" viewBox="0 0 24 24" role="img" aria-label="Selecionada"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg></span>
                  <span><span class="demo-t">Professor</span><span class="demo-s">Publica eventos das suas turmas</span></span>
                </a>
                <a class="demo" href="#tela-painel-admin" data-email="admin@agenda.test" aria-pressed="false">
                  <span style="display:flex;align-items:center;justify-content:space-between"><span class="demo-ico" style="background:#DBEAFE;color:#1E40AF"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg></span><svg class="i demo-check" viewBox="0 0 24 24" role="img" aria-label="Selecionada"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg></span>
                  <span><span class="demo-t">Administração</span><span class="demo-s">Importa o calendário oficial</span></span>
                </a>
              </div>

              <p style="margin-top:22px;font-size:13px;color:var(--muted);text-align:center">Senha das contas de demonstração: <span class="mono" style="color:var(--ink-2)">password123</span></p>
            </form>
          </section>
        </div>
      </div>
    </figure>

    <!-- ========================== TELA 1b · CRIAR CONTA ========================== -->
    <figure class="frame" id="tela-cadastro">
      <figcaption><span class="g-tag">Tela 1b</span><b>Criar conta</b> Auto-cadastro de aluno ou professor com nome, matrícula, e-mail e senha.<span class="g-rfs"><span class="g-rf">RF01</span></span></figcaption>
      <div class="screen desk" data-name="Tela 1b · Criar conta">
        <div style="min-height:940px;display:flex;flex-wrap:wrap">
          <section style="flex:1 1 600px;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:44px;padding:52px 60px;background:var(--night);color:#fff">
            <div style="display:flex;align-items:center;gap:14px">
              <span class="mark" style="width:48px;height:48px;border-radius:14px"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px" aria-hidden="true"><path d="M22 10v6"/><path d="M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></span>
              <div>
                <p class="disp" style="font-size:20px;font-weight:700">Agenda Acadêmica</p>
                <p style="margin-top:2px;font-size:13px;color:var(--on-night-2)">IFMS · Campus Três Lagoas</p>
              </div>
            </div>

            <div style="max-width:580px">
              <p class="eyebrow" style="color:var(--accent)">Primeiro acesso</p>
              <h1 class="disp" style="margin-top:14px;font-size:56px;line-height:1.02;font-weight:700;letter-spacing:-.035em">Sua agenda pronta em menos de um minuto.</h1>
              <p style="margin-top:18px;max-width:500px;font-size:17px;line-height:1.6;color:var(--on-night)">Escolha seu perfil e a agenda já mostra as datas da sua turma e o calendário oficial do campus.</p>

              <ol style="margin-top:36px;display:flex;flex-direction:column;gap:12px;max-width:480px">
                <li style="display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)">
                  <span class="disp" style="display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;background:var(--accent);color:var(--night);font-size:15px;font-weight:700;flex-shrink:0">1</span>
                  <span><span style="display:block;font-size:15px;font-weight:650">Aluno</span><span style="display:block;margin-top:3px;font-size:13px;line-height:1.5;color:var(--on-night-2)">Vê provas, trabalhos e datas oficiais da turma e ativa lembretes pessoais.</span></span>
                </li>
                <li style="display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)">
                  <span class="disp" style="display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;background:var(--accent);color:var(--night);font-size:15px;font-weight:700;flex-shrink:0">2</span>
                  <span><span style="display:block;font-size:15px;font-weight:650">Professor</span><span style="display:block;margin-top:3px;font-size:13px;line-height:1.5;color:var(--on-night-2)">Publica avaliações e entregas apenas nas turmas e disciplinas que leciona.</span></span>
                </li>
                <li style="display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.18)">
                  <span style="display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--on-night);flex-shrink:0"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                  <span><span style="display:block;font-size:15px;font-weight:650">Administração</span><span style="display:block;margin-top:3px;font-size:13px;line-height:1.5;color:var(--on-night-2)">Contas criadas pela própria instituição — não há auto-cadastro.</span></span>
                </li>
              </ol>
            </div>

            <p style="font-size:13px;color:var(--on-night-2)">Seus dados são usados apenas para organizar a agenda. Senhas são armazenadas com hash.</p>
          </section>

          <section style="flex:1 1 480px;min-width:0;display:flex;align-items:center;justify-content:center;padding:48px 32px;background:var(--bg)">
            <form style="width:100%;max-width:460px" aria-label="Criar conta">
              <nav class="seg" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%" aria-label="Acesso">
                <a href="#tela-entrar" style="justify-content:center"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Entrar</a>
                <a class="on" href="#tela-cadastro" aria-current="page" style="justify-content:center"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>Criar conta</a>
              </nav>

              <h2 class="disp" style="margin-top:30px;font-size:38px;line-height:1.1;font-weight:700">Criar minha conta</h2>
              <p style="margin-top:10px;font-size:15px;line-height:1.55;color:var(--ink-3)">Crie uma conta para acompanhar prazos e configurar lembretes.</p>

              <div style="margin-top:26px;display:flex;flex-direction:column;gap:16px">
                <div>
                  <span class="lbl">Perfil</span>
                  <div class="seg" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%">
                    <button class="on" type="button" aria-pressed="true" style="justify-content:center"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10v6"/><path d="M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>Aluno</button>
                    <button type="button" aria-pressed="false" style="justify-content:center"><svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Professor</button>
                  </div>
                </div>
                <div>
                  <label class="lbl" for="c-nome">Nome completo</label>
                  <input class="input" id="c-nome" value="Gabriel Alves Saran" autocomplete="name">
                </div>
                <div class="grid2">
                  <div>
                    <label class="lbl" for="c-mat">Matrícula <span class="hint">opcional</span></label>
                    <input class="input mono" id="c-mat" value="ALU-014" style="font-size:14px">
                  </div>
                  <div>
                    <label class="lbl" for="c-email">E-mail</label>
                    <input class="input" id="c-email" type="email" value="gabriel@agenda.test">
                  </div>
                </div>
                <div class="grid2">
                  <div>
                    <label class="lbl" for="c-senha">Senha <span class="hint">mín. 8</span></label>
                    <input class="input" id="c-senha" type="password" value="minhasenha1">
                  </div>
                  <div>
                    <label class="lbl" for="c-senha2">Confirmar senha</label>
                    <input class="input" id="c-senha2" type="password" value="minhasenha1">
                  </div>
                </div>
                <div data-match style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--brand)">
                  <svg class="i i-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                  As senhas conferem
                </div>
              </div>

              <a class="btn btn-p" href="#tela-painel-aluno" style="margin-top:22px;width:100%;min-height:52px;font-size:15.5px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>Criar conta e entrar</a>
              <p style="margin-top:18px;font-size:13.5px;color:var(--muted);text-align:center">Já tem conta? <a class="link" href="#tela-entrar" style="font-size:13.5px">Entrar</a></p>
            </form>
          </section>
        </div>
      </div>
    </figure>

  </div>
</section>
