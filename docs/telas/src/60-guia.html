
<section class="g-sec" id="sec-guia">
  <header class="g-sec-head">
    <span class="n">06</span>
    <h2>Guia visual</h2>
    <p>As decisões de cor, tipografia e componentes usadas em todas as telas — a base para manter a interface consistente na implementação em Next.js e Tailwind.</p>
  </header>
  <div class="g-frames">
    <figure class="frame" id="guia-visual">
      <figcaption><span class="g-tag">Guia</span><b>Guia visual</b> Princípios, paleta, categorias, tipografia e componentes.</figcaption>
      <div class="screen guide" data-name="Guia visual">
        <div style="padding:56px 64px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;background:var(--night);color:#fff">
          <div style="display:flex;align-items:center;gap:18px">
            <span class="mark" style="width:64px;height:64px;border-radius:18px"><svg class="i" viewBox="0 0 24 24" style="width:34px;height:34px" aria-hidden="true"><path d="M22 10v6"/><path d="M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></span>
            <div><p class="eyebrow" style="color:var(--accent)">Agenda Acadêmica · IFMS Três Lagoas</p><h3 class="disp" style="margin-top:6px;font-size:54px;font-weight:700;line-height:1">Guia visual</h3></div>
          </div>
          <p style="max-width:460px;font-size:15px;line-height:1.6;color:var(--on-night)">Azul para navegação e destaques, o verde do IF nas ações e um verde vivo para o que é urgente. Cada categoria tem sua cor — sempre acompanhada de texto, nunca só a cor.</p>
        </div>

        <div style="padding:48px 64px 64px;display:flex;flex-direction:column;gap:48px">

          <section aria-label="Princípios">
            <p class="eyebrow">Princípios</p>
            <div style="margin-top:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px">
              <div class="card pad"><p class="disp" style="font-size:34px;font-weight:700;color:var(--brand)">01</p><p style="margin-top:10px;font-size:16px;font-weight:700">O tempo vem primeiro</p><p class="sub">Datas grandes e prazos relativos — “amanhã”, “em 5 dias” — antes de qualquer outro dado.</p></div>
              <div class="card pad"><p class="disp" style="font-size:34px;font-weight:700;color:var(--brand)">02</p><p style="margin-top:10px;font-size:16px;font-weight:700">O oficial é visível</p><p class="sub">Datas da reitoria levam o selo “Oficial” e prevalecem sobre eventos locais.</p></div>
              <div class="card pad"><p class="disp" style="font-size:34px;font-weight:700;color:var(--brand)">03</p><p style="margin-top:10px;font-size:16px;font-weight:700">Cada perfil, sua visão</p><p class="sub">Aluno consulta, professor publica, administração oficializa. O menu mostra só o permitido.</p></div>
              <div class="card pad"><p class="disp" style="font-size:34px;font-weight:700;color:var(--brand)">04</p><p style="margin-top:10px;font-size:16px;font-weight:700">Leve no celular</p><p class="sub">Mesma linguagem visual em uma coluna, com áreas de toque de no mínimo 44 px.</p></div>
            </div>
          </section>

          <section aria-label="Cores da marca">
            <p class="eyebrow">Cores da marca e neutros</p>
            <div style="margin-top:16px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px"><div><div style="height:96px;border-radius:16px;background:var(--night);border:1px solid var(--line)"></div><p style="margin-top:10px;font-size:14px;font-weight:700">Azul</p><p class="mono muted" style="font-size:12px" data-hex="--night">#1F4E8C</p><p class="sub" style="font-size:12.5px">Menu e destaques</p></div><div><div style="height:96px;border-radius:16px;background:var(--brand);border:1px solid var(--line)"></div><p style="margin-top:10px;font-size:14px;font-weight:700">Verde IF</p><p class="mono muted" style="font-size:12px" data-hex="--brand">#17803F</p><p class="sub" style="font-size:12.5px">Ações e links</p></div><div><div style="height:96px;border-radius:16px;background:var(--accent);border:1px solid var(--line)"></div><p style="margin-top:10px;font-size:14px;font-weight:700">Verde vivo</p><p class="mono muted" style="font-size:12px" data-hex="--accent">#4ADE80</p><p class="sub" style="font-size:12.5px">Destaque sobre o azul</p></div><div><div style="height:96px;border-radius:16px;background:var(--brand-50);border:1px solid var(--line)"></div><p style="margin-top:10px;font-size:14px;font-weight:700">Verde claro</p><p class="mono muted" style="font-size:12px" data-hex="--brand-50">#EAF6EE</p><p class="sub" style="font-size:12.5px">Seleção e avisos</p></div><div><div style="height:96px;border-radius:16px;background:var(--bg);border:1px solid var(--line)"></div><p style="margin-top:10px;font-size:14px;font-weight:700">Fundo</p><p class="mono muted" style="font-size:12px" data-hex="--bg">#F1F3F7</p><p class="sub" style="font-size:12.5px">Plano da aplicação</p></div><div><div style="height:96px;border-radius:16px;background:var(--surface);border:1px solid var(--line)"></div><p style="margin-top:10px;font-size:14px;font-weight:700">Superfície</p><p class="mono muted" style="font-size:12px" data-hex="--surface">#FFFFFF</p><p class="sub" style="font-size:12.5px">Cartões</p></div><div><div style="height:96px;border-radius:16px;background:var(--ink);border:1px solid var(--line)"></div><p style="margin-top:10px;font-size:14px;font-weight:700">Tinta</p><p class="mono muted" style="font-size:12px" data-hex="--ink">#101828</p><p class="sub" style="font-size:12.5px">Texto principal</p></div><div><div style="height:96px;border-radius:16px;background:var(--muted);border:1px solid var(--line)"></div><p style="margin-top:10px;font-size:14px;font-weight:700">Texto secundário</p><p class="mono muted" style="font-size:12px" data-hex="--muted">#5D6678</p><p class="sub" style="font-size:12.5px">Legendas (5,7:1)</p></div></div>
          </section>

          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px">
            <section class="card pad" aria-label="Categorias de evento">
              <p class="eyebrow">Categorias de evento</p>
              <ul style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
                <li style="display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px"><span class="pill c-prova" style="width:fit-content">Prova</span><span class="sub" style="margin:0;font-size:13px">Avaliações com data e hora</span><span class="mono muted" style="font-size:12px"><span class="dot d-prova"></span> #E11D48</span></li>
                <li style="display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px"><span class="pill c-trab" style="width:fit-content">Trabalho</span><span class="sub" style="margin:0;font-size:13px">Entregas e projetos</span><span class="mono muted" style="font-size:12px"><span class="dot d-trab"></span> #7C3AED</span></li>
                <li style="display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px"><span class="pill c-ativ" style="width:fit-content">Atividade</span><span class="sub" style="margin:0;font-size:13px">Listas, seminários, exercícios</span><span class="mono muted" style="font-size:12px"><span class="dot d-ativ"></span> #0284C7</span></li>
                <li style="display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px"><span class="pill c-extra" style="width:fit-content">Extracurricular</span><span class="sub" style="margin:0;font-size:13px">Palestras e eventos opcionais</span><span class="mono muted" style="font-size:12px"><span class="dot d-extra"></span> #D97706</span></li>
                <li style="display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px"><span class="pill c-inst" style="width:fit-content">Institucional</span><span class="sub" style="margin:0;font-size:13px">Datas da reitoria · só admin</span><span class="mono muted" style="font-size:12px"><span class="dot d-inst"></span> #2563EB</span></li>
                <li style="display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px"><span class="pill c-fer" style="width:fit-content">Feriado</span><span class="sub" style="margin:0;font-size:13px">Sem aulas · só admin</span><span class="mono muted" style="font-size:12px"><span class="dot d-fer"></span> #059669</span></li>
                <li style="display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px"><span class="pill c-rec" style="width:fit-content">Recesso</span><span class="sub" style="margin:0;font-size:13px">Períodos sem aulas · só admin</span><span class="mono muted" style="font-size:12px"><span class="dot d-rec"></span> #65A30D</span></li>
              </ul>
              <hr class="divider" style="margin:20px 0 16px">
              <p class="eyebrow">Situação do evento</p>
              <div class="chips" style="margin-top:12px"><span class="pill st-ag">Agendado</span><span class="pill st-alt">Alterado</span><span class="pill st-conc">Concluído</span><span class="pill st-canc">Cancelado</span><span class="pill prio">Oficial</span></div>
            </section>

            <section class="card pad" aria-label="Tipografia">
              <p class="eyebrow">Tipografia</p>
              <div style="margin-top:16px;display:flex;flex-direction:column;gap:18px">
                <div><p class="disp" style="font-size:52px;font-weight:700;line-height:1">Bricolage Grotesque</p><p class="sub">Títulos, datas e números · 700 · 22 a 56 px</p></div>
                <div style="display:flex;align-items:baseline;gap:24px"><p class="disp" style="font-size:40px;font-weight:700">26 jun</p><p class="disp" style="font-size:28px;font-weight:700">Olá, Diogo</p><p class="disp" style="font-size:22px;font-weight:700">Próximos compromissos</p></div>
                <hr class="divider">
                <div><p style="font-size:24px;font-weight:600">Figtree — texto da interface</p><p class="sub">Corpo 14–15 px · rótulos 13,5 px · legendas 12,5 px · pesos 500, 600 e 700</p></div>
                <p style="font-size:15px;line-height:1.6;color:var(--ink-2)">Conteúdo: requisitos, UML e processo ágil. Consulta liberada ao material impresso.</p>
                <hr class="divider">
                <div><p class="mono" style="font-size:18px">JetBrains Mono · 19:00 · ALU-001</p><p class="sub">Matrículas, horários técnicos e JSON de importação</p></div>
              </div>
            </section>
          </div>

          <section aria-label="Componentes">
            <p class="eyebrow">Componentes</p>
            <div style="margin-top:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px">
              <div class="card pad" style="display:flex;flex-direction:column;gap:16px">
                <p style="font-size:15px;font-weight:700">Botões</p>
                <div style="display:flex;flex-wrap:wrap;gap:10px"><span class="btn btn-p">Criar evento</span><span class="btn btn-s">Cancelar</span><span class="btn btn-danger">Remover</span></div>
                <div style="display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-radius:14px;background:var(--night)"><span class="btn btn-lime">Ver detalhes</span><span class="btn btn-ghost">Ver no cronograma</span></div>
                <div style="display:flex;gap:10px;align-items:center"><span class="ib"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge"></span></span><span class="sub" style="margin:0">Botão de ícone · 46 px · sempre com rótulo acessível</span></div>
              </div>
              <div class="card pad" style="display:flex;flex-direction:column;gap:16px">
                <p style="font-size:15px;font-weight:700">Campos e filtros</p>
                <div><span class="lbl">Título <span class="hint">mín. 3 caracteres</span></span><span class="input" style="display:flex;align-items:center">Prova de Matemática — P2</span></div>
                <div><span class="lbl">Em foco</span><span class="input" style="display:flex;align-items:center;border-color:var(--brand);box-shadow:0 0 0 4px rgb(var(--brand-rgb) / .14)">Sala 12 · Bloco B</span></div>
                <div class="seg"><span class="on" style="display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:650;background:#fff;box-shadow:0 1px 3px rgb(var(--shadow-rgb) / .12)">Próximos</span><span style="display:inline-flex;align-items:center;height:38px;padding:0 14px;font-size:13.5px;font-weight:650;color:var(--ink-3)">Passados</span><span style="display:inline-flex;align-items:center;height:38px;padding:0 14px;font-size:13.5px;font-weight:650;color:var(--ink-3)">Todos</span></div>
                <div class="chips"><span class="chip all">Todas <span class="n">14</span></span><span class="chip"><span class="dot d-prova"></span>Provas</span><span class="chip lock">Recesso</span></div>
              </div>
              <div class="card pad" style="display:flex;flex-direction:column;gap:16px">
                <p style="font-size:15px;font-weight:700">Evento, indicador e menu</p>
                <div class="ev" style="padding:10px;border:1px solid var(--line-2)"><span class="ev-date"><span class="dw">Sex</span><span class="dn">26</span></span><span class="ev-body"><span class="ev-title" style="display:block">Prova de Eng. de Software</span><span class="ev-meta"><span class="pill c-prova">Prova</span><span>Sala 7</span></span></span><span class="ev-when"><span class="ev-time" style="display:block">19:00</span><span class="ev-rel soon" style="display:block">amanhã</span></span></div>
                <div class="card kpi" style="padding:16px"><div class="kpi-top"><p class="kpi-label">Provas à frente</p><span class="kpi-ico" style="background:#FFE4E8;color:#9F1239"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg></span></div><p class="kpi-val" style="font-size:34px">3</p></div>
                <div style="display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:16px;background:var(--night)"><span class="nav on">Item ativo</span><span class="nav">Item do menu<span class="count">3</span></span></div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </figure>
  </div>
</section>
